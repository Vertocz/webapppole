name: Traitement billets

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Debug variables
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "URL longueur: ${#NEXT_PUBLIC_SUPABASE_URL}"
          echo "URL début: ${NEXT_PUBLIC_SUPABASE_URL:0:30}"
          echo "Clé longueur: ${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "Clé début: ${SUPABASE_SERVICE_ROLE_KEY:0:20}"

      - name: Traiter les billets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/process_tickets.py
